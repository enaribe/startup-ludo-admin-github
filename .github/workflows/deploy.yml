# Déploiement automatique sur le VPS (admin admin.startupludo.io) à chaque push sur main.
# Le code est envoyé dans /srv/startupludo/admin/incoming puis /srv/startupludo/bin/deploy
# build une nouvelle version et ne bascule que si le build réussit et que le site répond.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Clé SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Envoi du code
        run: |
          rsync -az --delete \
            --exclude .git --exclude .github --exclude node_modules --exclude .next \
            ./ startupludo@162.19.154.223:/srv/startupludo/admin/incoming/

      - name: Build et mise en ligne
        run: ssh startupludo@162.19.154.223 /srv/startupludo/bin/deploy admin
